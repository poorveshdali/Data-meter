<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2 | Data Meter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .options button,
    .download-link {
      padding: 10px 16px;
      border: 1px solid #888;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font: inherit;
    }

    .download-link {
      color: #1d4ed8;
      text-decoration: none;
    }

    .options button[aria-pressed="true"] {
      color: #fff;
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    #viewer[hidden],
    #slide-viewer[hidden],
    #prototype-frame[hidden] {
      display: none;
    }

    #viewer {
      flex: 1;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
    }

    #viewer h2 {
      margin: 0;
      padding: 8px;
      font-size: 1rem;
    }

    #slide-viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #061a32;
    }

    #prototype-frame {
      flex: 1;
      width: 100%;
      min-height: 70vh;
      border: 0;
    }

    .slide-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    #slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slide-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px;
      color: #fff;
    }

    .slide-controls button {
      padding: 8px 12px;
      border: 1px solid #fff;
      border-radius: 6px;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }

    .slide-controls button:disabled {
      opacity: 0.5;
      cursor: default;
    }

  </style>
</head>
<body>
  <header>
    <a href="index.html">Back</a>
    <h1>Assignment 2</h1>
  </header>
  <main>
    <div class="options" aria-label="Assignment 2 options">
      <div class="option-group">
        <button id="documentation-button" type="button" aria-pressed="false">Documentation</button>
        <a class="download-link" href="Sadhana-Design-Process.pdf" download="Sadhana-Design-Process.pdf">Download PDF</a>
      </div>
      <div class="option-group">
        <button id="prototype-button" type="button" aria-pressed="false">Prototype</button>
      </div>
    </div>
    <section id="viewer" aria-live="polite" hidden>
      <h2 id="viewer-title">Documentation</h2>
      <div id="slide-viewer">
        <div class="slide-stage">
          <img id="slide-image" alt="">
        </div>
        <nav class="slide-controls" aria-label="Assignment 2 documentation slides">
          <button id="previous-slide" type="button">Previous</button>
          <span id="slide-count" aria-live="polite"></span>
          <button id="next-slide" type="button">Next</button>
        </nav>
      </div>
      <iframe id="prototype-frame" title="Assignment 2 prototype" src="Sadhana-BA.html" hidden></iframe>
    </section>
  </main>
  <script>
    const viewer = document.querySelector("#viewer");
    const viewerTitle = document.querySelector("#viewer-title");
    const slideViewer = document.querySelector("#slide-viewer");
    const prototypeFrame = document.querySelector("#prototype-frame");
    const slideImage = document.querySelector("#slide-image");
    const slideCount = document.querySelector("#slide-count");
    const previousSlide = document.querySelector("#previous-slide");
    const nextSlide = document.querySelector("#next-slide");
    const documentationButton = document.querySelector("#documentation-button");
    const prototypeButton = document.querySelector("#prototype-button");
    const totalSlides = 33;
    let currentSlide = 1;

    function showSlide(slide) {
      currentSlide = slide;
      slideImage.src = `assignment-2-slides/slide-${currentSlide}.jpg`;
      slideImage.alt = `Documentation slide ${currentSlide} of ${totalSlides}`;
      slideCount.textContent = `Slide ${currentSlide} of ${totalSlides}`;
      previousSlide.disabled = currentSlide === 1;
      nextSlide.disabled = currentSlide === totalSlides;
    }

    function setPressedButton(selectedButton) {
      [documentationButton, prototypeButton].forEach((button) => {
        button.setAttribute("aria-pressed", String(button === selectedButton));
      });
    }

    previousSlide.addEventListener("click", () => showSlide(currentSlide - 1));
    nextSlide.addEventListener("click", () => showSlide(currentSlide + 1));

    documentationButton.addEventListener("click", () => {
      viewerTitle.textContent = "Documentation";
      viewer.hidden = false;
      slideViewer.hidden = false;
      prototypeFrame.hidden = true;
      setPressedButton(documentationButton);
      showSlide(1);
    });

    prototypeButton.addEventListener("click", () => {
      viewerTitle.textContent = "Prototype";
      viewer.hidden = false;
      slideViewer.hidden = true;
      prototypeFrame.hidden = false;
      setPressedButton(prototypeButton);
    });
  </script>
</body>
</html>
